    function consultarResultado() {
        let cedula = document.getElementById('cedulaInput').value.trim().replace(/\./g, '');
        let resultBox = document.getElementById('result-box');
        
        if (cedula === "") {
            mostrarMensaje("Por favor, ingresa un número de cédula.", "error");
            return;
        }

        if (resultadosPUI[cedula]) {
            let nivel = resultadosPUI[cedula];
            let mensaje = nivel === "Eximido" 
                ? "¡Felicidades! Has sido <strong>Eximido</strong>." 
                : "Te corresponde cursar: <strong>" + nivel + "</strong>";
            mostrarMensaje(mensaje, "success");
        } else {
            mostrarMensaje("Cédula no encontrada. Por favor verifica o contacta a la coordinación.", "error");
        }
    }

    function mostrarMensaje(mensaje, tipo) {
        let resultBox = document.getElementById('result-box');
        resultBox.innerHTML = mensaje;
        resultBox.style.display = "block";
        
        if (tipo === "success") {
            resultBox.className = "result-success";
        } else {
            resultBox.className = "result-error";
        }
    }

        if (e.key === 'Enter') {
