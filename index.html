            padding: 0;

        }

            width: 85%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }
        input[type="text"]:focus {

        }
        button {
            background-color: #f37021;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 92%;
        }
        button:hover {

        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .success {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #c2e7cb;
        }
        .error {

            color: #c5221f;
            border: 1px solid #fad2cf;
            font-weight: bold;
        }
        .student-name {
            font-size: 18px;
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 5px;

    function buscarResultado() {
        const input = document.getElementById('cedulaInput').value.trim();
        const divResultado = document.getElementById('resultado');

        if (input === "") {
            divResultado.className = "result-box error";
            divResultado.innerHTML = "Por favor, introduce un número de cédula.";
            divResultado.style.display = "block";
            return;
        }

        if (estudiantes[input]) {
            const estudiante = estudiantes[input];
            divResultado.className = "result-box success";
            divResultado.innerHTML = `
                <div class="student-name">${estudiante.nombre}</div>
                <div style="font-size: 14px; color: #555; margin-bottom: 5px;">Nivel Asignado:</div>
                <div class="student-level">${estudiante.nivel}</div>
            `;
        } else {
            divResultado.className = "result-box error";
            divResultado.innerHTML = "Cédula no encontrada. Verifique los datos o contacte al departamento.";
        }
        
        divResultado.style.display = "block";
    }

    function checkEnter(event) {
        if (event.key === "Enter") {
            buscarResultado();
        }
